name: "LogChimp-Dev"

x-postgres-environment: &postgres-environment
  "LOGCHIMP_DB_HOST": db
  "LOGCHIMP_DB_DATABASE": ${POSTGRES_DB:-db}
  "LOGCHIMP_DB_PORT": 5432
  "LOGCHIMP_DB_USER": ${POSTGRES_USER:-lc}
  "LOGCHIMP_DB_PASSWORD": ${POSTGRES_PASSWORD:-password}
  "LOGCHIMP_DB_SSL": ${LOGCHIMP_DB_SSL:-false}
  # Enter postgres db url below if connecting via full db url
  # LOGCHIMP_DB_URL: postgresql://lc:password@db:5432/db

services:
  traefik:
    image: "traefik:v3"
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../../traefik/traefik.yml:/etc/traefik/traefik.yml
      - ../../traefik/dynamic.yml:/etc/traefik/dynamic.yml
      - ../../traefik/certs:/etc/certs
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - logchimp-dev-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.logchimp.dev`)"
      - "traefik.http.routers.traefik.entrypoints=web,websecure"
      - "traefik.http.routers.traefik.tls=true"
      - "traefik.http.services.traefik.loadbalancer.server.port=8080"

  cache:
    image: valkey/valkey:8
    ports:
      - "6379:6379"
    command: [ "valkey-server", "--save", "60", "1", "--loglevel", "warning", "--dir", "/data" ]
    volumes:
      - valkey-data:/data
    networks:
      - logchimp-dev-network

  db:
    image: postgres:12
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-db}
      POSTGRES_USER: ${POSTGRES_USER:-lc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    networks:
      - logchimp-dev-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pg_data:/var/lib/postgresql/data

  migrator:
    build:
      dockerfile: docker/local/server.Dockerfile
      context: ../..
      args:
        DOCKER_BUILDKIT: 1
    command: [ "./scripts/migrate.sh" ]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PNPM_CONFIG_CONFIRM_MODULES_PURGE: "false"
      # Database
      <<: *postgres-environment
    networks:
      - logchimp-dev-network
    healthcheck:
      test: [ "CMD", "sh", "-c", "pnpm knex migrate:status --knexfile ./src/database/config.ts" ]
      interval: 5s
      timeout: 1s
      retries: 1
    restart: "no"

  # Local SMTP mailbox
  mail:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
    networks:
      - logchimp-dev-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mail.rule=Host(`mail.logchimp.dev`)"
      - "traefik.http.routers.mail.entrypoints=websecure"
      - "traefik.http.routers.mail.tls=true"
      - "traefik.http.services.mail.loadbalancer.server.port=8025"

  api:
    build:
      dockerfile: docker/local/server.Dockerfile
      context: ../..
      args:
        DOCKER_BUILDKIT: 1
    command: [ "sh", "docker-dev-entrypoint.sh" ]
    volumes:
      - ../..:/app
      - /app/node_modules
      - /app/packages/server/node_modules
      - /app/packages/server/dist
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
      migrator:
        condition: service_completed_successfully
    networks:
      - logchimp-dev-network
    environment:
      PORT: 3000
      # Database
      <<: *postgres-environment
      # Cache
      LOGCHIMP_VALKEY_URL: cache:6379
      # Mail
      LOGCHIMP_MAIL_HOST: mail
      LOGCHIMP_MAIL_PORT: 1025
      LOGCHIMP_MAIL_USER: test
      LOGCHIMP_MAIL_PASSWORD: test
      PNPM_CONFIG_CONFIRM_MODULES_PURGE: "false"
    env_file:
      - ../../packages/server/.env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.logchimp.dev`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.services.api.loadbalancer.server.port=3000"

  bullboard:
    image: venatum/bull-board:latest
    environment:
      REDIS_HOST: "cache"
    networks:
      - logchimp-dev-network
    depends_on:
      - cache
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bullboard.rule=Host(`bullmq-ui.logchimp.dev`)"
      - "traefik.http.routers.bullboard.entrypoints=websecure"
      - "traefik.http.routers.bullboard.tls=true"
      - "traefik.http.services.bullboard.loadbalancer.server.port=3000"

  theme:
    build:
      dockerfile: docker/local/theme.Dockerfile
      context: ../..
      args:
        DOCKER_BUILDKIT: 1
    volumes:
      - ../../:/app
      - /app/node_modules
      - /app/packages/theme/node_modules
      - /app/packages/theme/dist
    env_file:
      - ../../packages/theme/.env
    depends_on:
       - api
    networks:
      - logchimp-dev-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.webapp.rule=Host(`logchimp.dev`)"
      - "traefik.http.routers.webapp.entrypoints=websecure"
      - "traefik.http.routers.webapp.tls=true"
      - "traefik.http.services.webapp.loadbalancer.server.port=3000"

networks:
  logchimp-dev-network:
    name: logchimp-dev-network
    driver: bridge

volumes:
  valkey-data:
  pg_data:
